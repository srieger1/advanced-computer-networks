# ACN Lab L1 — Szenario 2: Link Aggregation (LACP, 802.3ad)
# Deploy:  containerlab deploy -t scenario2-lag.clab.yml
# Abbau:   containerlab destroy -t scenario2-lag.clab.yml --cleanup
# Doku:    labsheet.md
#
# Zwei Switches, verbunden über zwei parallele Links, die zu einem LACP-Bond gebündelt sind.
# Beobachtung: beide Links sind gleichzeitig aktiv (Bandbreitenbündelung) und ein Linkausfall
# kostet praktisch keine Pakete — der Unterschied zu Szenario 1 (STP).
name: acn-l1-lag

# Mgmt-Netz IPv4-only (siehe Stolperfalle 9): containerlabs dual-stack-Default gibt den Containern
# eine IPv6-Default-Route ohne echten IPv6-Egress — Clients ohne Happy-Eyeballs (busybox) blockieren
# dann an toten AAAA-Pfaden (z. B. `apk add`).
mgmt:
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: ""

topology:
  nodes:
    sw1:
      kind: linux
      image: frrouting/frr:latest
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set bond0 up
        - ip link add br0 type bridge
        - ip link set bond0 master br0
        - ip link set eth3 master br0
        - ip link set br0 up
        - ip link set eth3 up
    sw2:
      kind: linux
      image: frrouting/frr:latest
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set bond0 up
        - ip link add br0 type bridge
        - ip link set bond0 master br0
        - ip link set eth3 master br0
        - ip link set br0 up
        - ip link set eth3 up
    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.21.0.1/24 dev eth1
        - ip link set eth1 up
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.21.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    # Zwei parallele Links zwischen sw1 und sw2 -> LACP-Bündel
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw1:eth2", "sw2:eth2"]
    # Zugangsports
    - endpoints: ["sw1:eth3", "h1:eth1"]
    - endpoints: ["sw2:eth3", "h2:eth1"]
